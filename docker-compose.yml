services:
  postgres:
    image: postgres:16-alpine
    container_name: projeto2027_postgres
    restart: always
    environment:
      POSTGRES_DB: projeto2027
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.postgres.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d projeto2027"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

